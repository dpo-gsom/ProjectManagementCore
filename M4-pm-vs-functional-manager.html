<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PM и функциональный менеджер — Проектное управление</title>

  <!-- Шрифты: Inter + Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">

  <!-- Общая дизайн-система -->
  <link rel="stylesheet" href="styles.css">

  <style>
    /* Все экраны одной высоты — iframe не «прыгает» */
    .screen { min-height: 762px; display: flex; flex-direction: column; }
    .screen__body { flex: 1; display: flex; flex-direction: column; justify-content: center; }

    /* ─── Шапка сцены ─────────────────────────────────────── */
    .scene-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .scene-period {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--red);
    }

    .scene-step {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--slate);
      opacity: 0.6;
    }

    /* ─── Текст сцены ─────────────────────────────────────── */
    .scene-text {
      font-size: 15px;
      line-height: 1.7;
      color: var(--slate);
    }

    .scene-text p + p { margin-top: 10px; }
    .scene-text b { color: var(--dark); font-weight: 600; }

    /* ─── Блок разбора ────────────────────────────────────── */
    .insight {
      background: var(--sand);
      border-left: 4px solid var(--dark);
      border-radius: var(--radius-md);
      padding: 13px 15px;
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--slate);
      margin-top: 16px;
    }

    .insight__label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--dark);
      margin-bottom: 5px;
    }

    /* ─── Варианты выбора ─────────────────────────────────── */
    .options { display: flex; flex-direction: column; gap: 10px; }

    .opt {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.15s, background 0.15s, transform 0.15s, box-shadow 0.15s;
    }

    .opt:hover {
      border-color: var(--dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 59, 72, 0.1);
    }

    .opt:active { transform: translateY(0); }

    .opt__title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--dark);
      line-height: 1.35;
      margin-bottom: 4px;
    }

    .opt__desc { font-size: 13px; line-height: 1.55; color: var(--slate); }

    /* ─── Случайное событие ───────────────────────────────── */
    .dice {
      background: var(--dark);
      color: var(--white);
      border-radius: var(--radius-lg);
      padding: 20px 22px;
      text-align: center;
    }

    .dice__label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #F0A070;
      margin-bottom: 10px;
    }

    .dice__prob {
      font-family: var(--font-display);
      font-size: 40px;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 6px;
    }

    .dice__text { font-size: 13.5px; line-height: 1.6; color: rgba(255,255,255,0.78); }

    /* ─── Итог проекта ────────────────────────────────────── */
    .facts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 16px 0;
    }

    .fact {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 11px 12px;
      text-align: center;
    }

    .fact__label {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--slate);
      opacity: 0.7;
      margin-bottom: 4px;
    }

    .fact__value {
      font-size: 13px;
      font-weight: 700;
      color: var(--dark);
      line-height: 1.35;
    }

    /* ─── Пройденный путь ─────────────────────────────────── */
    .path { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin-top: 4px; }

    .path__item {
      font-size: 11px;
      font-weight: 600;
      background: var(--sand);
      border: 1px solid var(--border);
      color: var(--slate);
      padding: 3px 9px;
      border-radius: 20px;
      line-height: 1.5;
    }

    .path__arrow { font-size: 11px; color: var(--border); }

    /* ─── Хронология «как было» ───────────────────────────── */
    .timeline { margin: 4px 0 0; }

    .tl-row {
      display: flex;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      line-height: 1.55;
      color: var(--slate);
    }

    .tl-row:last-child { border-bottom: none; }

    .tl-when {
      flex: 0 0 108px;
      font-weight: 700;
      color: var(--dark);
      font-size: 12px;
      letter-spacing: 0.3px;
    }

    /* ─── Таблица ключевых моментов ───────────────────────── */
    .keytable { display: flex; flex-direction: column; gap: 6px; }

    .kt-row {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .kt-head {
      background: var(--dark);
      color: var(--white);
      font-size: 12.5px;
      font-weight: 700;
      padding: 7px 12px;
      line-height: 1.4;
    }

    .kt-cells { display: grid; grid-template-columns: 1fr 1fr; }

    .kt-cell { padding: 8px 12px; font-size: 11.5px; line-height: 1.5; color: var(--slate); }
    .kt-cell + .kt-cell { border-left: 1.5px solid var(--border); }

    .kt-cell__label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .kt-cell--good { background: var(--green-bg); }
    .kt-cell--good .kt-cell__label { color: var(--green); }
    .kt-cell--bad  { background: var(--red-bg);  }
    .kt-cell--bad  .kt-cell__label { color: var(--red); }

    /* ─── Карточка действующего лица ──────────────────────── */
    .cast {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      margin-bottom: 10px;
    }

    .cast__name {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 2px;
    }

    .cast__role {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 6px;
    }

    .cast__desc { font-size: 13px; line-height: 1.6; color: var(--slate); }

    @media (max-width: 560px) {
      .facts    { grid-template-columns: 1fr; }
      .kt-cells { grid-template-columns: 1fr; }
      .kt-cell + .kt-cell { border-left: none; border-top: 1.5px solid var(--border); }
      .tl-row   { flex-direction: column; gap: 2px; }
      .tl-when  { flex: none; }
      .screen   { min-height: 900px; }
    }
  </style>
</head>
<body>

<div id="app"></div>

<script src="common.js"></script>

<script>
/* ═══════════════════════════════════════════════════════════
   ГРАФ СЦЕНАРИЯ

   Виды узлов:
     scene  — нарратив или последствие выбора + разбор + «Далее»
     choice — вопрос + варианты действий
     random — событие вне контроля PM, с показанной вероятностью
     end    — финал: факты по проекту + разбор + путь

   Переходы между ветками реальные: правильное действие,
   сделанное позже, ведёт в ту же логику, но с потерей времени.
   ═══════════════════════════════════════════════════════════ */

var FM  = 'Фёдор Максимович';        /* именительный */
var FMg = 'Фёдора Максимовича';      /* родительный / винительный */
var FMd = 'Фёдору Максимовичу';      /* дательный */
var FMi = 'Фёдором Максимовичем';    /* творительный */

var NODES = {

/* ─── ВВОДНЫЕ ЭКРАНЫ ─────────────────────────────────────── */

intro1: {
  kind: 'scene',
  period: 'Январь',
  title: 'Ответственность есть.<span>Власти нет</span>',
  text:
    '<p>Крупный российский банк из топ-10. Вам поручено возглавить <b>проект цифровизации процесса оценки кредитного риска</b>: 7 месяцев, бюджет 12 млн рублей. Срок зафиксирован решением Правления и не двигается.</p>' +
    '<p>Вы в банке 3 года. Достаточно, чтобы знать ключевых людей, и недостаточно, чтобы иметь политический вес старожила.</p>' +
    '<p>Спонсор проекта — заместитель Председателя Правления. Доступен, но загружен.</p>',
  next: 'intro2',
  btn: 'Кто ещё в игре →'
},

intro2: {
  kind: 'scene',
  period: 'Расстановка сил',
  cast: true,
  text:
    '<p><b>8 из 12 членов вашей команды — его сотрудники.</b> Они работают на проект, но административно подчиняются ему, а не вам: он может вернуть их на операционные задачи в любой момент.</p>' +
    '<p>Проект инициирован без его участия в формировании содержания. Формально он поддерживает. Реальное отношение вам неизвестно.</p>' +
    '<p>Прямой иерархии между вами нет — вы коллеги одного уровня. Без его предметной экспертизы система будет выстроена с ошибками: он единственный, кто знает процессы изнутри.</p>',
  insight:
    'В матричной структуре у руководителя проекта есть ответственность за результат и нет власти над людьми, которые этот результат делают. Единственный доступный инструмент — договорённость.',
  next: 'R1',
  btn: 'Начать →'
},

/* ─── РАЗВИЛКА 1 ─────────────────────────────────────────── */

R1: {
  kind: 'choice',
  period: 'Первая неделя',
  q: 'Вы получили полномочия от спонсора. ' + FM + ' узнал о проекте из приказа. С чего начинаете?',
  options: [
    { title: 'Формальный старт: сначала документы',
      desc: 'Направляете устав проекта, запрос на выделение ресурсов, приглашение на установочное совещание со спонсором. Всё официально и по процессу.',
      to: 'A_start', tag: 'Формальный старт' },
    { title: 'Неформальный старт: сначала разговор',
      desc: 'Первым делом — встреча один на один. Без повестки и документов. Просто познакомиться и услышать его взгляд на проект.',
      to: 'B_start', tag: 'Разговор один на один' },
    { title: 'Начать с команды, с ' + FMi + ' — позже',
      desc: 'Приоритет — быстро погрузить команду в проект. С функциональным менеджером разберётесь по ходу, когда будет понятна реальная картина.',
      to: 'V_start', tag: 'Сначала команда' }
  ]
},

/* ══════════════ ВЕТКА А · ФОРМАЛЬНЫЙ СТАРТ ══════════════ */

A_start: {
  kind: 'scene',
  period: 'Январь–февраль',
  text:
    '<p>' + FM + ' получает пакет документов и реагирует корректно. На установочном совещании со спонсором присутствует, задаёт деловые вопросы. Его восемь человек формально введены в проект.</p>' +
    '<p>Первые две недели — тишина и видимое спокойствие.</p>',
  insight:
    'Формальный старт не создаёт конфликта — он создаёт неизвестность. Вы не знаете, что он думает о проекте, а он не знает, зачем проект нужен. Обе стороны считают, что всё в порядке.',
  next: 'RA1'
},

RA1: {
  kind: 'choice',
  period: 'Конец февраля',
  q: 'Двое аналитиков ' + FMg + ' системно пропускают встречи проекта. Что делаете?',
  options: [
    { title: 'Формальный запрос',
      desc: 'Письмо с просьбой обеспечить присутствие сотрудников. Со ссылкой на приказ о проекте и подписанный устав.',
      to: 'A1a', tag: 'Письмо со ссылкой на приказ' },
    { title: 'Неформальный разговор',
      desc: 'Заходите к нему без повестки — просто узнать, есть ли сложности с выделением людей. Не давите, слушаете.',
      to: 'A1b', tag: 'Зайти и спросить' }
  ]
},

A1a: {
  kind: 'scene',
  period: 'Начало марта',
  text:
    '<p>' + FM + ' считает письмо давлением. На ближайшем Управляющем комитете он упоминает, что <b>проект создаёт операционные риски для управления</b>.</p>' +
    '<p>Отношения охладели — и охладели публично.</p>',
  insight:
    'Ссылка на приказ означает «у меня есть право вас обязать». Для коллеги одного уровня это не аргумент, а вызов. Ответ приходит там, где у него преимущество: на площадке, где его слушают 15 лет.',
  next: 'RA1_esc'
},

RA1_esc: {
  kind: 'choice',
  period: 'Март',
  q: 'Спонсор услышал реплику ' + FMg + ' на Управляющем комитете и спрашивает вас, что происходит. Как реагируете?',
  options: [
    { title: 'Попросить спонсора подтвердить ваши полномочия',
      desc: 'Публично, на том же уровне, где прозвучала претензия. Чтобы вопрос о том, кто управляет проектом, больше не поднимался.',
      to: 'A1a_alpha', tag: 'Подтвердить полномочия сверху' },
    { title: 'Пойти к ' + FMd + ' самому, без претензий',
      desc: 'После заседания. Не объясняться и не защищаться — предложить разобраться вместе, что именно его беспокоит.',
      to: 'B_late', tag: 'Пойти на разговор' }
  ]
},

A1a_alpha: {
  kind: 'scene',
  period: 'Март',
  text:
    '<p>Спонсор подтверждает ваши полномочия. Формально ' + FM + ' подчиняется.</p>' +
    '<p>Фактически он уходит в пассивное сопротивление: перестаёт блокировать, но и не помогает. Аналитики на встречах присутствуют, инициативы не проявляют, на вопросы отвечают осторожно. Ключевые экспертные решения начинают затягиваться.</p>',
  insight:
    'Административный ресурс выигрывает эпизод и проигрывает отношения. Заставить человека присутствовать можно приказом. Заставить его думать на вашем проекте — нельзя.',
  next: 'RA1a2'
},

RA1a2: {
  kind: 'choice',
  period: 'Апрель',
  q: 'Проект отстаёт на 2 недели: экспертные решения зависают на стороне ' + FMg + '. Что делаете?',
  options: [
    { title: 'Эскалировать к спонсору',
      desc: 'Описываете ситуацию на встрече один на один. Просите поговорить с ' + FMi + ' напрямую или дать вам больше полномочий.',
      to: 'A1aI', tag: 'Эскалация' },
    { title: 'Сменить подход — прийти открыто',
      desc: 'Встреча один на один. Прямо: «Понимаю, что старт был формальным. Хочу разобраться, что действительно мешает». Без давления.',
      to: 'A1aII', tag: 'Открытый разговор' }
  ]
},

A1aI: {
  kind: 'scene',
  period: 'Апрель',
  text:
    '<p>Спонсор проводит разговор. ' + FM + ' внешне соглашается, но воспринимает это как поражение.</p>' +
    '<p>Сотрудничество становится ещё более формальным. Решения идут быстрее, качество экспертизы падает.</p>',
  insight:
    'Вторая эскалация подряд расходует не только отношения, но и спонсора: его слово перестаёт быть событием. Ресурс, который стоило приберечь для стратегической развилки, потрачен на операционную.',
  next: 'RA1aI'
},

RA1aI: {
  kind: 'choice',
  period: 'Май',
  q: FM + ' выполняет обязательства формально: строго то, что записано, и ни шагом больше. Что дальше?',
  options: [
    { title: 'Принять как рабочую реальность',
      desc: 'Фокус на процессе и контроле. Отношения уже не исправить, а проект надо довести.',
      to: 'END_a_formal', tag: 'Работать через процесс' },
    { title: 'Через месяц выйти на честный разговор',
      desc: 'Теперь уже понимая его позицию. Без ожидания, что он сделает первый шаг.',
      to: 'END_a_partial', tag: 'Разговор с опозданием' }
  ]
},

A1aII: {
  kind: 'scene',
  period: 'Апрель',
  text:
    '<p>' + FM + ' открывается. Оказывается, его беспокоят <b>два конкретных блока содержания проекта</b>: после внедрения они лягут дополнительной нагрузкой на его управление, которое и так перегружено операционкой.</p>' +
    '<p>Разговор переходит в совместный поиск решения.</p>',
  insight:
    'Три месяца сопротивления объяснялись двумя пунктами, о которых можно было узнать в первую неделю. Сопротивление почти всегда предметно — просто его не спрашивали.',
  next: 'RA1aII'
},

RA1aII: {
  kind: 'choice',
  period: 'Апрель',
  q: FM + ' назвал два проблемных блока. Как реагируете?',
  options: [
    { title: 'Пересмотреть оба блока совместно',
      desc: 'Он входит в рабочую группу и становится соавтором решения, а не его получателем. Потеря 2 недель.',
      to: 'B1a_start', tag: 'Соавторство' },
    { title: 'Адаптировать один, второй объяснить',
      desc: 'Компромисс: по одному блоку идёте навстречу, по второму объясняете, почему изменить нельзя.',
      to: 'B1b_start', tag: 'Частичный компромисс' }
  ]
},

A1b: {
  kind: 'scene',
  period: 'Конец февраля',
  text:
    '<p>' + FM + ' оживает. Говорит, что не понимал, зачем именно эти встречи нужны его аналитикам — со стороны это выглядело как отвлечение людей от работы.</p>' +
    '<p>Предлагает ввести короткую координационную встречу на 15 минут раз в неделю для сверки.</p>',
  insight:
    'Вопрос «есть ли сложности» стоит дешевле требования «обеспечьте присутствие» и приносит больше. Он позволяет собеседнику объяснить своё поведение, не признавая вину.',
  next: 'RA1b'
},

RA1b: {
  kind: 'choice',
  period: 'Март',
  q: FM + ' предложил формат еженедельной сверки. Как его выстраиваете?',
  options: [
    { title: 'Расширить повестку',
      desc: 'Принимаете формат и добавляете статус рисков и решения по команде. Не только «кто где», но и «что решаем».',
      to: 'A1b_alpha', tag: 'Расширить повестку' },
    { title: 'Оставить как есть',
      desc: 'Короткая сверка присутствия и статусов. Не перегружать формат, который он сам предложил.',
      to: 'END_a_neutral', tag: 'Только сверка статусов' }
  ]
},

A1b_alpha: {
  kind: 'scene',
  period: 'Март–апрель',

function go(id) {
  state.node = id;
  render();
}

function choose(idx) {
  var n = NODES[state.node];
  var o = n.options[idx];
  state.path.push(o.tag);
  state.steps = state.steps + 1;
  go(o.to);
}

function roll() {
  var n = NODES[state.node];
  var win = (Math.random() * 100) < n.prob;
  state.path.push(win ? 'Случай: за вас' : 'Случай: против вас');
  go(win ? n.yes : n.no);
}

function restart() {
  state = { node: 'intro1', path: [], steps: 0 };
  render();
}

/* ═══════════════════════════════════════════════════════════
   ПАМЯТКА В PNG
   Рисуется на canvas вручную — без внешних библиотек.
   Кириллица и ретина-плотность работают штатно.
   ═══════════════════════════════════════════════════════════ */

var MEMO = {
  W: 820,          /* ширина макета в CSS-пикселях */
  SCALE: 2,        /* плотность: итоговый PNG 1640px по ширине */
  PAD: 40,         /* поля макета */
  GAP: 10,         /* зазор между блоками */
  CPAD: 16,        /* внутренние поля ячейки */
  LH: 19,          /* межстрочный интервал в ячейке */
  F_TITLE: '900 27px "Playfair Display", Georgia, serif',
  F_SUB:   '400 13px Inter, -apple-system, sans-serif',
  F_HEAD:  '700 14px Inter, -apple-system, sans-serif',
  F_LABEL: '700 10px Inter, -apple-system, sans-serif',
  F_BODY:  '400 13px Inter, -apple-system, sans-serif',
  F_FOOT:  '400 11px Inter, -apple-system, sans-serif'
};

/* Перенос текста по словам под заданную ширину */
function wrapText(ctx, text, maxW) {
  var words = text.split(' ');
  var lines = [];
  var cur = '';
  for (var i = 0; i < words.length; i++) {
    var test = cur ? cur + ' ' + words[i] : words[i];
    if (cur && ctx.measureText(test).width > maxW) {
      lines.push(cur);
      cur = words[i];
    } else {
      cur = test;
    }
  }
  if (cur) lines.push(cur);
  return lines;
}

/* Прямоугольник со скруглением (с запасным вариантом) */
function roundRect(ctx, x, y, w, h, r) {
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

/* Раскладка: считаем высоту каждого блока до отрисовки */
function layoutMemo(ctx) {
  var m = MEMO;
  var colW = (m.W - m.PAD * 2) / 2;
  var textW = colW - m.CPAD * 2;
  var blocks = [];

  for (var i = 0; i < KEY_TABLE.length; i++) {
    var r = KEY_TABLE[i];

    ctx.font = m.F_HEAD;
    var headLines = wrapText(ctx, r.key, m.W - m.PAD * 2 - m.CPAD * 2);
    var headH = headLines.length * 20 + 16;

    ctx.font = m.F_BODY;
    var goodLines = wrapText(ctx, r.good, textW);
    var badLines  = wrapText(ctx, r.bad,  textW);
    var cellH = Math.max(goodLines.length, badLines.length) * m.LH + m.CPAD * 2 + 18;

    blocks.push({ headLines: headLines, headH: headH, goodLines: goodLines, badLines: badLines, cellH: cellH });
  }

  var y = 116;  /* шапка: заголовок, подзаголовок, черта */
  for (var j = 0; j < blocks.length; j++) {
    blocks[j].y = y;
    y += blocks[j].headH + blocks[j].cellH + m.GAP;
  }

  return { blocks: blocks, colW: colW, textW: textW, height: y + 34 };
}

function drawMemo() {
  var m = MEMO;
  var measure = document.createElement('canvas').getContext('2d');
  var L = layoutMemo(measure);

  var cv = document.createElement('canvas');
  cv.width  = m.W * m.SCALE;
  cv.height = L.height * m.SCALE;
  var ctx = cv.getContext('2d');
  ctx.scale(m.SCALE, m.SCALE);
  ctx.textBaseline = 'top';

  /* Фон и акцентная полоса сверху — как на странице */
  ctx.fillStyle = '#FAF8F4';
  ctx.fillRect(0, 0, m.W, L.height);

  var strip = ctx.createLinearGradient(0, 0, m.W, 0);
  strip.addColorStop(0,   '#C31532');
  strip.addColorStop(0.5, '#003B48');
  strip.addColorStop(1,   '#C31532');
  ctx.fillStyle = strip;
  ctx.fillRect(0, 0, m.W, 5);

  /* Шапка */
  ctx.fillStyle = '#003B48';
  ctx.font = m.F_TITLE;
  ctx.fillText('Что определяет исход в корпоративном проекте', m.PAD, m.PAD);

  ctx.fillStyle = '#495761';
  ctx.font = m.F_SUB;
  ctx.fillText('Руководитель проекта и функциональный менеджер в матричной структуре', m.PAD, m.PAD + 38);

  ctx.fillStyle = '#C31532';
  ctx.fillRect(m.PAD, m.PAD + 64, 50, 2);

  /* Блоки */
  for (var i = 0; i < L.blocks.length; i++) {
    var b = L.blocks[i];
    var x = m.PAD;
    var w = m.W - m.PAD * 2;

    /* Тёмная шапка блока */
    ctx.fillStyle = '#003B48';
    roundRect(ctx, x, b.y, w, b.headH + 8, 8);
    ctx.fill();
    ctx.fillRect(x, b.y + b.headH - 4, w, 12);

    ctx.fillStyle = '#FFFFFF';
    ctx.font = m.F_HEAD;
    for (var h = 0; h < b.headLines.length; h++) {
      ctx.fillText(b.headLines[h], x + m.CPAD, b.y + 9 + h * 20);
    }

    /* Две колонки */
    var cy = b.y + b.headH;
    drawCell(ctx, x,          cy, L.colW, b.cellH, '#EBF5EF', '#1A6B4A', 'РЕШЕНО В НАЧАЛЕ', b.goodLines, true);
    drawCell(ctx, x + L.colW, cy, L.colW, b.cellH, '#FEF0F2', '#C31532', 'ОТЛОЖЕНО ИЛИ ПРОИГНОРИРОВАНО', b.badLines, false);

    /* Обводка блока */
    ctx.strokeStyle = '#DDD8CF';
    ctx.lineWidth = 1.5;
    roundRect(ctx, x, b.y, w, b.headH + b.cellH, 8);
    ctx.stroke();
  }

  /* Подвал */
  ctx.fillStyle = '#495761';
  ctx.font = m.F_FOOT;
  ctx.globalAlpha = 0.65;
  ctx.fillText('Высшая школа менеджмента СПбГУ · Проектное управление', m.PAD, L.height - 26);
  ctx.globalAlpha = 1;

  return cv;
}

function drawCell(ctx, x, y, w, h, bg, labelColor, label, lines, roundLeft) {
  var m = MEMO;

  ctx.fillStyle = bg;
  ctx.fillRect(x, y, w, h);

  /* Разделитель между колонками */
  if (!roundLeft) {
    ctx.fillStyle = '#DDD8CF';
    ctx.fillRect(x, y, 1.5, h);
  }

  ctx.fillStyle = labelColor;
  ctx.font = m.F_LABEL;
  if ('letterSpacing' in ctx) ctx.letterSpacing = '1px';
  ctx.fillText(label, x + m.CPAD, y + m.CPAD);
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';

  ctx.fillStyle = '#495761';
  ctx.font = m.F_BODY;
  for (var i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], x + m.CPAD, y + m.CPAD + 18 + i * m.LH);
  }
}

/* ─── Скачивание памятки ────────────────────────────────── */
function downloadTable() {
  /* Дожидаемся загрузки Inter и Playfair, иначе canvas нарисует системным шрифтом */
  if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
    document.fonts.ready.then(saveMemo);
  } else {
    saveMemo();
  }
}

function saveMemo() {
  var cv;
  try {
    cv = drawMemo();
  } catch (e) {
    return;
  }

  var name = 'pamyatka-pm-i-funkcionalnyy-menedzher.png';

  if (cv.toBlob) {
    cv.toBlob(function(blob) {
      var url = URL.createObjectURL(blob);
      if (!triggerDownload(url, name)) window.open(url, '_blank');
      setTimeout(function() { URL.revokeObjectURL(url); }, 4000);
    }, 'image/png');
  } else {
    var dataUrl = cv.toDataURL('image/png');
    if (!triggerDownload(dataUrl, name)) window.open(dataUrl, '_blank');
  }
}

function triggerDownload(href, name) {
  try {
    var a = document.createElement('a');
    if (!('download' in a)) return false;
    a.href = href;
    a.download = name;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    return true;
  } catch (e) {
    return false;
  }
}

/* ─── Старт ─────────────────────────────────────────────── */
render();
</script>
